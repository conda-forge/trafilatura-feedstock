context:
  version: "2.1.0"

package:
  name: trafilatura
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/trafilatura/trafilatura-${{ version }}.tar.gz
    sha256: f689e2116fc89c7bc0b9a296d01dcfe2eb0b5455f8c371a77dc0db1f06a05643

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install .
  python:
    entry_points:
      - trafilatura  =  trafilatura.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - certifi
    - charset-normalizer >=3.4.0
    - courlan >=1.4.0
    - htmldate >=1.10.0
    - justext >=3.0.2
    - lxml >=6.1.1
    - urllib3 <3,>=1.26

tests:
  - python:
      imports:
        - trafilatura
      python_version: ${{ python_min }}.*
      pip_check: true
  - script:
      - trafilatura --help

about:
  summary: 'Python & Command-line tool to gather text and metadata on the Web: Crawling, scraping, extraction, output as CSV, JSON, HTML, MD, TXT, XML.'
  homepage: https://github.com/adbar/trafilatura
  description:
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - moritzwilksch
